name: Build

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ master ]
    tags:
      - 'Release-*'  # Triggers on official releases (always builds)
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [ master ]
  workflow_dispatch:  # Manual trigger (always builds, skips path filter)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Bump the version when the downloaded or extracted SDK files change (.github/scripts/windows-sdk.ps1)
  SDK_CACHE_KEY: Windows-sdks-sdk7.0sp1-sdk7.1-setup-v2

jobs:
  get-version:
    name: Extract Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history for git describe

      - name: Get Version
        id: version
        shell: bash
        run: |
          # Get version using git describe --long (matches update_commit_id.bat)
          FULL_VERSION=$(git describe --tags --long 2>/dev/null || echo "No-Tag-$(git rev-parse --short HEAD)")
          
          # Extract version same way as minidump code (remove prefix before first '-')
          # "Release-5.1.3-0-g9fb5755" → "5.1.3-0-g9fb5755"
          # "No-Tag-abc123d" → "abc123d"
          VERSION=$(echo "$FULL_VERSION" | sed 's/^[^-]*-//')
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Full version: $FULL_VERSION"
          echo "Artifact version: $VERSION"

  detect-changes:
    if: github.event.pull_request.draft == false && !startsWith(github.ref, 'refs/tags/')
    name: Detect File Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dll-source: ${{ steps.filter.outputs.dll-source }}
      build-scripts: ${{ steps.filter.outputs.build-scripts }}
      workflow: ${{ steps.filter.outputs.workflow }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          token: ''
          filters: |
            dll-source:
              - 'CvGameCoreDLL_Expansion2/**'
              - 'CvGameCoreDLLUtil/**'
              - 'CvGameDatabase/**'
              - 'CvLocalization/**'
              - 'CvWorldBuilderMap/**'
              - 'FirePlace/**'
              - 'ThirdPartyLibs/**'
              - '*.cpp'
              - '*.h'
            build-scripts:
              - 'build_vp_clang*.py'
              - 'update_commit_id.bat'
            workflow:
              - '.github/workflows/**'
            dependencies:
              - '*.sln'
              - '*.vcxproj'

      - name: Changes Summary
        run: |
          echo "### 🔍 File Changes Summary" >> $GITHUB_STEP_SUMMARY
          echo "- DLL Source: ${{ steps.filter.outputs.dll-source == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Scripts: ${{ steps.filter.outputs.build-scripts == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow: ${{ steps.filter.outputs.workflow == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dependencies: ${{ steps.filter.outputs.dependencies == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY

  setup:
    needs: [get-version, detect-changes]
    if: |
      always() && needs.get-version.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/Release-') ||
       github.event_name == 'workflow_dispatch' ||
       (needs.detect-changes.result == 'success' && 
        (needs.detect-changes.outputs.dll-source == 'true' || 
         needs.detect-changes.outputs.build-scripts == 'true' || 
         needs.detect-changes.outputs.workflow == 'true' || 
         needs.detect-changes.outputs.dependencies == 'true')))
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout SDK script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - uses: actions/cache@v6
        id: cache
        with:
          path: |
            SDK7
            SDK7.1
          key: ${{ env.SDK_CACHE_KEY }}

      - name: Download Windows SDK 7.0 SP1 and 7.1
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 75
        run: ./.github/scripts/windows-sdk.ps1 -Action Download

  build-clang:
    needs: [get-version, detect-changes, setup]
    if: |
      always() && needs.setup.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/Release-') ||
       github.event_name == 'workflow_dispatch' ||
       (needs.detect-changes.result == 'success' && 
        (needs.detect-changes.outputs.dll-source == 'true' || 
         needs.detect-changes.outputs.build-scripts == 'true' || 
         needs.detect-changes.outputs.workflow == 'true' || 
         needs.detect-changes.outputs.dependencies == 'true')))
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Restore Windows SDK setup files
        uses: actions/cache/restore@v6
        with:
          path: |
            SDK7
            SDK7.1
          key: ${{ env.SDK_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Install SDKs
        run: ./.github/scripts/windows-sdk.ps1 -Action Install

      - name: Upload msiexec logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: msiexec-logs-${{ github.job }}
          path: ${{ runner.temp }}/sdk-msi-logs
          if-no-files-found: ignore

      - name: Clang version check
        run: clang --version

      - name: Run debug build
        run: python build_vp_clang_sdk.py --config debug

      - name: Display debug build log
        if: always() && hashFiles('clang-output/Debug/build.log') != ''
        run: cat clang-output/Debug/build.log

      - name: Run release build
        run: python build_vp_clang_sdk.py --config release

      - name: Display release build log
        if: always() && hashFiles('clang-output/Release/build.log') != ''
        run: cat clang-output/Release/build.log

      - name: Analyze Clang build warnings and errors
        if: always()
        run: ./.github/scripts/analyze-build-log.ps1 "Clang Debug=clang-output/Debug/build.log" "Clang Release=clang-output/Release/build.log"

      - name: Create debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: VP_Clang_Debug_${{ needs.get-version.outputs.version }}
          path: 'clang-output\Debug'
          if-no-files-found: error

      - name: Create release artifact
        uses: actions/upload-artifact@v7
        with:
          name: VP_Clang_Release_${{ needs.get-version.outputs.version }}
          path: 'clang-output\Release'
          if-no-files-found: error

  build-msvc:
    needs: [get-version, detect-changes, setup]
    if: |
      always() && needs.setup.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/Release-') ||
       github.event_name == 'workflow_dispatch' ||
       (needs.detect-changes.result == 'success' && 
        (needs.detect-changes.outputs.dll-source == 'true' || 
         needs.detect-changes.outputs.build-scripts == 'true' || 
         needs.detect-changes.outputs.workflow == 'true' || 
         needs.detect-changes.outputs.dependencies == 'true')))
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Restore Windows SDK setup files
        uses: actions/cache/restore@v6
        with:
          path: |
            SDK7
            SDK7.1
          key: ${{ env.SDK_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Install SDKs
        run: ./.github/scripts/windows-sdk.ps1 -Action Install

      - name: Upload msiexec logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: msiexec-logs-${{ github.job }}
          path: ${{ runner.temp }}/sdk-msi-logs
          if-no-files-found: ignore

      - name: Copy DLLs to v90 folders # Bypass Microsoft.Cpp.Win32.Targets(57,5): error MSB6006: "CL.exe" exited with code -1073741515.
        run: |
          echo "Copying DLLs to v90 folders..."
          cp "C:\Program Files (x86)\Microsoft Visual Studio 9.0\Common7\IDE\msobj80.dll" "C:\Program Files (x86)\Microsoft Visual Studio 9.0\VC\bin"
          cp "C:\Program Files (x86)\Microsoft Visual Studio 9.0\Common7\IDE\mspdb80.dll" "C:\Program Files (x86)\Microsoft Visual Studio 9.0\VC\bin"
          cp "C:\Program Files (x86)\Microsoft Visual Studio 9.0\Common7\IDE\mspdbcore.dll" "C:\Program Files (x86)\Microsoft Visual Studio 9.0\VC\bin"
          cp "C:\Program Files (x86)\Microsoft Visual Studio 9.0\Common7\IDE\mspdbsrv.exe" "C:\Program Files (x86)\Microsoft Visual Studio 9.0\VC\bin"
          echo "DLLs copied to v90 folders."

      - name: Set Registry Keys # Bypass Microsoft.Cpp.Win32.Targets(57,5): error : Required file "" is missing.
        run: |
          # PowerShell script to set registry key
          $regPath32 = "HKLM:\SOFTWARE\Wow6432Node\Microsoft\Microsoft SDKs\Windows"
          # Path to installed SDK, with the trailing backslash: the v90 props append "lib" and "include" to it
          $newInstallFolder = "C:\Program Files (x86)\Microsoft SDKs\Windows\v7.1\" # 7.1 is required to bypass error. 7.0 doesn't work.
          Set-ItemProperty -Path $regPath32 -Name "CurrentInstallFolder" -Value $newInstallFolder
          Write-Output "Registry key set successfully."

      - name: Setup Visual Studio environment and build msvc debug
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          msbuild VoxPopuli_vs2013.sln /p:Configuration=Debug /p:Platform=Win32 /v:normal /flp:logfile=msvc_debug_msbuild.log;verbosity=normal

      - name: Setup Visual Studio environment and build msvc release
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          msbuild VoxPopuli_vs2013.sln /p:Configuration=Release /p:Platform=Win32 /v:normal /flp:logfile=msvc_release_msbuild.log;verbosity=normal

      - name: Analyze build warnings and errors
        if: always()
        run: ./.github/scripts/analyze-build-log.ps1 "MSVC Debug=msvc_debug_msbuild.log" "MSVC Release=msvc_release_msbuild.log"

      - name: Create msvc debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: VP_MSVC_Debug_${{ needs.get-version.outputs.version }}
          path: 'BuildOutput/Debug'
          if-no-files-found: error

      - name: Create msvc release artifact
        uses: actions/upload-artifact@v7
        with:
          name: VP_MSVC_Release_${{ needs.get-version.outputs.version }}
          path: 'BuildOutput/Release'
          if-no-files-found: error


